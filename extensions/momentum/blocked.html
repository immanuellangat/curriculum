<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stay focused</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="blocked-page">
    <main class="blocked-card">
      <p class="eyebrow">Focus Plus</p>
      <h1>This site is blocked while you focus</h1>
      <p class="blocked-note">Finish your session to get it back, or unblock now if you need it.</p>
      <div class="blocked-actions">
        <button id="blocked-back" class="secondary-button" type="button">Go back</button>
        <button id="blocked-unblock" class="secondary-button" type="button">Unblock sites</button>
      </div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
